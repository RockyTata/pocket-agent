<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Agent">
<title>Pocket Agent</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<script src="theme.js"></script>
<style>
  :root {
    /* 和 Codex 一起定的统一规范（/tmp/xs/spec.md 那份）：各页同一套值，切页不再像换了个网站 */
    --bg: #0B0A0F; --panel: #17151E; --panel2: #211E29; --line: rgba(255,255,255,.12);
    --text: #F1EDF0; --dim: #B9B2BD; --faint: #918A97;
    --warm: #F5B583; --on-warm: #24150D; --cyan: #8FDEE3; --red: #F09B94; --green: #91D5A2; --me: #302938;
    --scrim: rgba(0,0,0,.58); --ease: cubic-bezier(.2,0,0,1);
    color-scheme: dark;
  }
  /* 白天：只换颜色变量和几处写死的深色，结构不动 */
  html.light {
    --bg: #F6F4F1; --panel: #FFFFFF; --panel2: #F0ECE8; --line: rgba(40,30,24,.14);
    --text: #211D1A; --dim: #665E58; --faint: #766D67;
    --warm: #C55D20; --on-warm: #FFFFFF; --cyan: #096E78; --red: #B43128; --green: #24743C; --me: #F5E8DC;
    --scrim: rgba(28,22,19,.42);
  }
  html.light .sw i, html.light .bar { background: rgba(0,0,0,.12); }
  html.light #live, html.light .msg.ai pre, html.light .msg.ai code { background: #efebe5; }
  html.light .sheet > div { box-shadow: 0 -8px 30px rgba(0,0,0,.12); }
  html.light #tbar { background: linear-gradient(var(--bg) 85%, transparent); }
  html.light .gauge circle:first-child { stroke: rgba(0,0,0,.08); }
  html.light #newBtn, html.light #send, html.light .sheet .go:not(.ghost), html.light #lock button, html.light .askSend { color: var(--on-warm); }
  html.light .msg.side { background: rgba(31,143,153,.06); }
  #findBtn { color: var(--dim); width: 40px; height: 36px; margin: -6px 0; display: flex; align-items: center; justify-content: center; }
  /* 搜索：打开时把电表、文件夹、列表都收起来，只留结果，免得眼睛在两套东西之间跳 */
  #findBar, #findRes { display: none; }
  body.finding #findBar { display: flex; gap: 8px; align-items: center; position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 2px 0 10px; }
  body.finding #findRes { display: block; }
  #vseg { margin: 2px 0 10px; } body.finding #vseg, body.mapOn #qswipe, body.mapOn #qdots, body.mapOn #fbar, body.mapOn #list, body.mapOn #impBtn { display: none !important; }
  body.finding #qswipe, body.finding #qdots, body.finding #fbar, body.finding #list, body.finding #impBtn, body.finding #newBtn { display: none !important; }
  #findQ { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line); background: var(--panel); font-size: 16px; outline: none; }
  #findQ:focus { border-color: var(--warm); }
  #findX { height: 44px; padding: 0 4px 0 6px; color: var(--cyan); font-size: 15px; }
  #findRes .hint { color: var(--faint); font-size: 13.5px; text-align: center; padding: 28px 12px; line-height: 1.7; }
  #findRes mark { background: rgba(245,181,131,.28); color: inherit; border-radius: 3px; padding: 0 1px; }
  html.light #findRes mark { background: rgba(197,93,32,.18); }
  .msg.flash { animation: flash 1.8s var(--ease); }
  .msg { scroll-margin-top: 56px; }   /* 跳过去时别被顶上那行模型信息挡住 */
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 2px var(--warm); } 100% { box-shadow: 0 0 0 2px transparent; } }
  #themeBtn { font-size: 18px; color: var(--dim); width: 40px; height: 36px; margin: -6px -8px -6px 0; }
  /* 列表页的「派活」当大标题；进了对话标题就是对话名，小一号 */
  body:not(.inthread) header b { font-size: 22px; font-weight: 700; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; -webkit-text-size-adjust: 100%; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  a { color: var(--cyan); }
  header { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; border-bottom: 1px solid var(--line); }
  header b { flex: 1; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header button { font-size: 14px; color: var(--cyan); }
  /* 顶部标签：把工作台、选题、留言都收进这一个网址，不用记好几个地址 */
  #tabs { flex: none; display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  #tabs button { flex: 1 0 auto; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); font-size: 14px; }
  /* 装在 App 里时灵感、工作台在 App 底栏上，这里只去掉这两个重复的；选题、留言、音乐还得从这儿进 */
  /* 装在 App 里：灵感、工作台在 App 底栏上，选题、留言、音乐收进了 App 的工作台，派活页只剩对话 */
  .inapp #tabs { display: none !important; }
  #tabs button.on { border-color: var(--warm); color: var(--warm); background: rgba(245,181,131,.08); }
  #frames { flex: 1; display: none; min-height: 0; }
  #frames.on { display: block; }
  #frames iframe { width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  #frames iframe.on { display: block; }
  main { flex: 1; overflow-y: auto; padding: 12px 14px 24px; }
  .view { display: none; } .view.on { display: contents; }

  /* 电表 */
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .meters[hidden] { display: none; }
  .meter { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
  .meter h4 { margin: 0 0 4px; font-size: 12px; color: var(--dim); font-weight: 500; }
  .meter .big { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .meter .sub { font-size: 11.5px; color: var(--faint); margin-top: 2px; line-height: 1.45; }
  .meter.off .big { font-size: 14px; color: var(--faint); font-weight: 500; }
  /* 额度表：每家一张卡，两个圆表——5 小时、本周，圈里是还剩多少 */
  .qcard { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 10px 9px; min-width: 0; }
  .qcard .qh { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .qcard .qh small { flex: 1; font-weight: 400; font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qcard .qh button { font-size: 15px; color: var(--dim); padding: 0 2px; line-height: 1; }
  .qcard .qh button.spin { animation: sp 1s linear infinite; } @keyframes sp { to { transform: rotate(360deg); } }
  .qrow { display: flex; justify-content: space-around; }
  .gauge { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .gauge .ring { position: relative; width: 64px; height: 64px; }
  .gauge svg { width: 64px; height: 64px; transform: rotate(-90deg); display: block; }
  .gauge .ring b { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .gauge .ring b i { font-style: normal; font-size: 9.5px; color: var(--faint); font-weight: 400; }
  .gauge span { font-size: 11.5px; color: var(--dim); } .gauge em { font-style: normal; font-size: 10.5px; color: var(--faint); }
  .meters.one { grid-template-columns: 1fr; }
  .qmini { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
  .qr { display: flex; align-items: center; gap: 12px; padding: 3px 0; }
  .qr strong { flex: none; width: 52px; font-size: 13px; font-weight: 600; }
  .qb { flex: 1; display: flex; align-items: center; gap: 7px; min-width: 0; }
  .qb em { font-style: normal; font-size: 11.5px; color: var(--faint); flex: none; }
  .qb i { flex: 1; height: 6px; border-radius: 9px; background: var(--line); overflow: hidden; min-width: 30px; }
  .qb i b { display: block; height: 100%; border-radius: 9px; }
  .qb u { text-decoration: none; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; width: 34px; text-align: right; flex: none; }
  .qfold { grid-column: 1 / -1; font-size: 12.5px; color: var(--faint); padding: 2px 0 4px; }
  .qcard .qh button { width: 36px; height: 30px; margin: -6px -8px -6px 0; }
  .qcard .none { font-size: 12px; color: var(--faint); padding: 18px 0; text-align: center; }
  /* 额度和 API Key 两页横着滑；容器高度跟着当前页走，不然短的那页下面会空一大块 */
  #qswipe { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; align-items: flex-start; transition: height .2s; }
  #qswipe::-webkit-scrollbar { display: none; }
  #qswipe > * { flex: 0 0 100%; scroll-snap-align: start; margin-bottom: 0; }
  #qdots { display: flex; justify-content: center; gap: 5px; margin: 7px 0 10px; }
  #qdots i { width: 5px; height: 5px; border-radius: 3px; background: var(--line); transition: width .2s; }
  #qdots i.on { width: 14px; background: var(--dim); }
  .kp { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 6px; }
  .kh { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .kh small { flex: 1; font-weight: 400; font-size: 11px; color: var(--faint); }
  .kh button { width: 36px; height: 30px; margin: -6px -8px -6px 0; font-size: 15px; color: var(--dim); }
  .kh button.spin { animation: sp 1s linear infinite; }
  .kr { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  .kr > div:first-child { flex: 1; min-width: 0; }
  .kr b { display: block; font-size: 13px; font-weight: 600; }
  .kr em, .kv em { font-style: normal; font-size: 11px; color: var(--faint); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kv { text-align: right; flex: none; }
  .kv u { text-decoration: none; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }

  h3.sec { font-size: 13px; color: var(--dim); font-weight: 500; margin: 18px 2px 8px; display: flex; align-items: center; }
  h3.sec .tidy { margin-left: auto; font-size: 12.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 99px; padding: 5px 11px; }
  .card.thing .tag { color: var(--dim); }
  /* 连不上时的小条：贴在内容顶上，不挡操作；旧内容照常显示 */
  #netbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 8px; padding: 7px 12px; border-radius: 12px; font-size: 12px; color: var(--dim);
    background: color-mix(in srgb, var(--panel) 80%, transparent); border: .5px solid var(--line); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  #netbar[hidden] { display: none; }
  #netbar button { color: var(--warm); font-size: 12px; font-weight: 600; padding: 2px 6px; }
  .thtags { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 4px; }
  .card.thing .tag.askgo { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); background: color-mix(in srgb, var(--red) 10%, transparent); }
  #tgL .r { display: flex; align-items: center; gap: 8px; padding: 11px 2px; border-bottom: 1px solid var(--line); }
  #tgL .r > div { flex: 1; min-width: 0; text-align: left; } #tgL .r small { display: block; color: var(--faint); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tgL .r .sp { flex: none; font-size: 12.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 99px; padding: 5px 10px; }
  #tgSheet .mbtn { display: block; width: 100%; text-align: left; margin-top: 10px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 15px; }
  .card { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px; margin-bottom: 8px; }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card .t { flex: 1; font-size: 15.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta { font-size: 12px; color: var(--faint); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta { margin-top: 6px; } .card .ag.claude { color: var(--warm); } .card .ag.codex { color: var(--cyan); }
  .card .sum { font-size: 13.5px; color: var(--dim); margin-top: 4px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card { padding: 13px 15px; border-radius: 16px; }
  .card .live { font-size: 12.5px; color: var(--warm); margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { flex: none; font-size: 11px; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); }
  .tag.claude { color: var(--warm); } .tag.codex { color: var(--cyan); }
  .st { flex: none; font-size: 11.5px; }
  .st.running { color: var(--warm); } .st.review { color: var(--green); } .st.error { color: var(--red); } .st.idle, .st.done { color: var(--faint); }
  .dot::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 5px; vertical-align: 1px; }
  .st.running.dot::before { animation: b 1s infinite; }
  @keyframes b { 50% { opacity: .2; } }
  /* 文件夹：列表上面一排，点一个只看这个文件夹里的 */
  #fbar { display: flex; gap: 6px; overflow-x: auto; margin: 2px 0 4px; padding-bottom: 2px; }
  #fbar:empty { display: none; }
  #fbar button { flex: none; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); font-size: 13px; }
  #fbar button.on { border-color: var(--warm); color: var(--warm); background: rgba(245,181,131,.08); }
  .card .pin { color: var(--warm); font-size: 12px; flex: none; }
  .card[data-id] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .card.lp { transform: scale(.97); transition: transform .15s; }
  #title.tap::after { content: ' ▾'; color: var(--faint); font-size: 12px; }
  /* 整理一条对话的弹层 */
  #mgSheet .mrow { display: flex; gap: 8px; }
  #mgSheet .mrow input { flex: 1; }
  #mgSheet .mrow button, #mgSheet .mbtn { padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 15px; }
  #mgSheet .mbtn { display: block; width: 100%; text-align: left; margin-top: 10px; }
  #mgSheet .mbtn.del { color: var(--red); }
  #mgSheet .fl { display: flex; flex-wrap: wrap; gap: 8px; }
  #mgSheet .fl button { padding: 8px 13px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); font-size: 14px; }
  #mgSheet .fl button.on { border-color: var(--warm); color: var(--warm); background: rgba(245,181,131,.08); }
  .empty { text-align: center; color: var(--faint); font-size: 13px; padding: 30px 0; line-height: 1.8; }
  #newBtn { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 18px); background: var(--warm); color: var(--on-warm); font-weight: 700; padding: 13px 20px; border-radius: 99px; box-shadow: 0 6px 24px rgba(0,0,0,.4); }

  /* 对话 */
  .msg { margin: 0 0 14px; line-height: 1.7; font-size: 15.5px; overflow-wrap: anywhere; }
  .msg.user { margin-left: 15%; background: var(--me); padding: 10px 13px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; }
  .msg .ts { display: block; font-size: 11px; color: var(--faint); margin-top: 4px; }
  .msg.ai p { margin: .4em 0; }
  .msg.ai h1, .msg.ai h2, .msg.ai h3 { font-size: 16.5px; margin: 1em 0 .3em; }
  .msg.ai ul, .msg.ai ol { padding-left: 1.3em; margin: .3em 0; }
  .msg.ai code { font-family: Menlo, monospace; font-size: 13px; background: var(--panel); padding: 1px 5px; border-radius: 5px; }
  .msg.ai pre { background: var(--panel); border-radius: 10px; padding: 10px; overflow-x: auto; }
  .msg.ai pre code { padding: 0; }
  /* 复制按钮：代码块右上角一个，每条消息时间旁边一个 */
  /* 手机上横向滑动看命令很难受，直接折行；右边留出复制按钮的位置 */
  .msg.ai pre { position: relative; white-space: pre-wrap; word-break: break-all; padding-right: 64px; }
  .msg :not(pre) > code { cursor: pointer; }
  .kw { border-bottom: 1px dotted var(--faint); }
  .msg strong { cursor: pointer; }
  #kwBar { position: fixed; z-index: 70; display: none; gap: 2px; padding: 4px; border-radius: 12px; background: var(--surface, #222); border: 1px solid var(--line); box-shadow: 0 8px 28px rgba(0,0,0,.35); }
  #kwBar.on { display: flex; }
  #kwBar button { font: 14px/1 -apple-system, sans-serif; color: var(--text, #eee); padding: 10px 14px; border-radius: 8px; }
  .cp { font: 12px/1 -apple-system, sans-serif; color: var(--dim); background: var(--panel2, #222); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; }
  pre > .cp { position: absolute; top: 6px; right: 6px; }
  .ts > .cp, .msg > .cp { margin-left: 8px; padding: 3px 8px; font-size: 11px; vertical-align: 1px; }
  .cp.ok { color: var(--warm); border-color: var(--warm); }
  .msg.ai table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
  .msg.ai th, .msg.ai td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; white-space: nowrap; }
  .msg.ai blockquote { margin: .4em 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--dim); }
  /* AI 出的选择题：点选代替打字 */
  .ask { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin: 10px 0; }
  .ask .askq { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
  .ask .multi { font-size: 11.5px; color: var(--faint); font-weight: 400; margin-left: 6px; }
  .ask .opt { display: block; width: 100%; text-align: left; padding: 10px 12px; margin: 6px 0 0; border-radius: 11px; border: 1px solid var(--line); background: var(--panel2); font-size: 14.5px; line-height: 1.45; }
  .ask .opt.on { border-color: var(--warm); color: var(--warm); background: rgba(245,181,131,.1); }
  .ask .opt:disabled { opacity: .45; }
  .ask .askx { display: block; width: 100%; margin-top: 8px; padding: 9px 12px; border-radius: 11px; border: 1px dashed var(--line); background: transparent; color: inherit; font: inherit; font-size: 14px; resize: none; }
  .ask .askx:disabled { opacity: .45; }
  .askSend { display: block; width: 100%; margin: 4px 0 10px; padding: 11px; border-radius: 12px; background: var(--warm); color: var(--on-warm); font-weight: 700; }
  .askSend:disabled { opacity: .35; }
  .askDone .opt:not(.on) { opacity: .4; }
  .msg.err { color: var(--red); }
  .att img, .media { display: block; max-width: 100%; max-height: 60vh; border-radius: 10px; margin: 8px 0; background: #000; }
  .user .att { display: flex; gap: 6px; flex-wrap: wrap; } .user .att img { width: 90px; height: 90px; object-fit: contain; margin: 6px 0 0; }
  /* 「正在干什么」：一行一步，最新的在下面，像看终端但是人话 */
  #live { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 11px; margin: 4px 0 14px; font-size: 12.5px; line-height: 1.65; color: var(--dim); }
  #live.on { display: block; }
  #live .hd { color: var(--warm); font-weight: 600; margin-bottom: 3px; display: flex; justify-content: space-between; }
  #live .ln { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #live .ln:last-child { color: var(--text); }
  /* 钉在顶上：聊长了往下翻，也随时能看到/换模型、点停下 */
  #tbar { display: flex; gap: 8px; padding: 8px 0 10px; margin-top: -12px; align-items: center; position: sticky; top: -12px; z-index: 3; background: linear-gradient(var(--bg) 85%, transparent); }
  #tbar button { font-size: 12.5px; padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); }
  #tbar .stop { color: var(--red); border-color: var(--red); }
  #tbar .done { color: var(--green); border-color: rgba(143,214,155,.5); }
  /* 对话顶上一行小字：谁、什么模型、在哪个项目。点模型那段就能换 */
  #tbar .meta { flex: 1 1 auto; min-width: 0; padding: 0 2px; border: 0; border-radius: 0; font-size: 12px; color: var(--faint); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tbar .meta u { text-decoration: none; color: var(--warm); }
  /* 顺便问一句：问答成对显示成一张浅色卡，和主线对话分开 */
  .msg.side { background: rgba(134,224,230,.06); border: 1px dashed rgba(134,224,230,.35); border-radius: 14px; padding: 9px 12px; font-size: 14.5px; }
  .msg.side code { font-family: Menlo, monospace; font-size: 13px; background: var(--panel); padding: 1px 5px; border-radius: 5px; }
  .msg.side p { margin: .3em 0; }
  .msg.side .sq { color: var(--cyan); font-size: 13px; margin-bottom: 4px; }
  .msg.side.wait .sa { color: var(--faint); }
  .msg.cmd { margin-left: 15%; text-align: right; font-size: 12.5px; color: var(--faint); }
  #mode { display: none; align-items: center; gap: 8px; padding: 2px 4px 8px; font-size: 13px; color: var(--cyan); }
  #mode.on { display: flex; }
  #mode span { flex: 1; }
  #mode button { color: var(--faint); font-size: 13px; }
  .side-on #input { border-color: rgba(134,224,230,.5); }
  .side-on #send { background: var(--cyan); }
  #attach.on { transform: rotate(45deg); color: var(--warm); border-color: var(--warm); }
  #attach { transition: transform .18s; }
  /* 加号菜单：一行一件事，图标 + 名字 + 一句小字说清楚什么时候用 */
  #plusSheet .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #plusSheet .act { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); text-align: left; min-height: 74px; }
  #plusSheet .act b { font-size: 15px; font-weight: 600; } #plusSheet .act b i { font-style: normal; margin-right: 6px; }
  #plusSheet .act small { font-size: 11.5px; color: var(--faint); line-height: 1.4; }
  #plusSheet .act:disabled { opacity: .35; }
  #plusSheet .act.wide { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; justify-content: space-between; }
  #plusSheet .quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  #plusSheet .quick button { padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); font-size: 13.5px; }
  .shd { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 12px; }
  .shd b { font-size: 18px; } .shx { width: 44px; height: 44px; margin: -10px -10px -10px 0; border-radius: 22px; color: var(--faint); font-size: 16px; }
  #plusSheet h4 { margin: 16px 2px 0; font-size: 12px; color: var(--faint); font-weight: 500; }

  footer { flex: none; border-top: 1px solid var(--line); padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px); display: none; }
  footer.on { display: block; }
  /* 引用对话：发出去前显示成小标签，可以点 ✕ 去掉；@ 弹出的候选挨着输入框 */
  /* 引用某条消息回复：输入框上方一条灰条，发出去后在气泡顶上显示成同样的灰条 */
  #quoteBar { display: none; align-items: center; gap: 6px; margin: 0 2px 8px; padding: 6px 4px 6px 10px; border-left: 3px solid var(--warm); border-radius: 6px; background: var(--panel); }
  #quoteBar.on { display: flex; } #quoteBar span { flex: 1; min-width: 0; font-size: 13px; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  #quoteBar button { flex: none; width: 36px; height: 36px; color: var(--faint); font-size: 13px; }
  .msg .qd { margin: 0 0 6px; padding: 4px 8px; border-left: 3px solid currentColor; border-radius: 4px; opacity: .65; font-size: .9em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  .msg.lp { transform: scale(.98); transition: transform .15s; }
  #refs { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 2px 8px; } #refs:empty { display: none; }
  .rchip { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; height: 30px; padding: 0 4px 0 10px; border-radius: 15px;
    background: rgba(143,222,227,.12); color: var(--cyan); font-size: 13.5px; }
  html.light .rchip { background: rgba(9,110,120,.09); }
  .rchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rchip button { width: 30px; height: 30px; color: inherit; opacity: .7; font-size: 12px; }
  #atList { display: none; margin: 0 0 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); overflow: hidden; }
  #atList.on { display: block; }
  #atList button, #refPick button { display: flex; width: 100%; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; text-align: left; border-top: 1px solid var(--line); }
  #atList button:first-child, #refPick button:first-child { border-top: 0; }
  #atList b, #refPick b { flex: 1; min-width: 0; font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #atList small, #refPick small { color: var(--faint); font-size: 12px; flex: none; }
  #atList .none { padding: 14px; color: var(--faint); font-size: 13.5px; }
  #refQ { width: 100%; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line); background: var(--panel); font-size: 16px; outline: none; margin-bottom: 10px; }
  #refPick { max-height: 52dvh; overflow-y: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); margin-bottom: 12px; }
  #refPick i { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); font-style: normal; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  #refPick button.on i { background: var(--cyan); border-color: var(--cyan); color: var(--bg); }
  .msg .refd { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  /* 输入联想：一行横滑的小条，点一下补全。按住不放松手前不抢输入框焦点，键盘不会收起 */
  #sugg { display: flex; gap: 8px; overflow-x: auto; padding: 0 2px 8px; scrollbar-width: none; }
  #sugg:empty { display: none; } #sugg::-webkit-scrollbar { display: none; }
  #sugg button { flex: none; max-width: 78vw; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: var(--panel);
    color: var(--dim); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sugg button:active { transform: scale(.97); }
  #sugg mark { background: none; color: var(--text); font-weight: 600; }
  #pending { display: flex; gap: 10px; flex-wrap: wrap; padding: 4px 2px 8px; }
  #pending:empty { display: none; }
  #pending span { position: relative; }
  #pending img, #pending .file { width: 72px; height: 72px; object-fit: contain; border-radius: 10px; display: block; border: 1px solid var(--line); background: var(--panel); font-size: 11px; overflow: hidden; padding: 4px; }
  #pending .up { opacity: .4; }
  #pending b { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%; background: var(--red); color: #fff; font-size: 14px; line-height: 22px; text-align: center; }
  #pending b::after { content: ''; position: absolute; inset: -11px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  #attach { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); font-size: 22px; color: var(--dim); }
  #input { flex: 1; resize: none; max-height: 40vh; padding: 9px 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); font-size: 16px; line-height: 1.45; outline: none; }
  #send { flex: none; height: 40px; padding: 0 16px; border-radius: 20px; background: var(--warm); color: var(--on-warm); font-weight: 700; }
  #send:disabled { opacity: .4; }

  /* 新建对话 / 口令 弹层 */
  /* 弹层：遮罩淡入、面板从下往上滑；不用 display:none 直接切，收起时也有动画。顶上的小横条可以往下拖着关 */
  .sheet { position: fixed; inset: 0; z-index: 30; background: var(--scrim); display: flex; align-items: flex-end;
    visibility: hidden; opacity: 0; pointer-events: none; transition: opacity .15s, visibility 0s linear .26s; }
  .sheet.on { visibility: visible; opacity: 1; pointer-events: auto; transition: opacity .15s; }
  .sheet > div { width: 100%; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--panel2); border-radius: 24px 24px 0 0;
    padding: 22px 16px calc(env(safe-area-inset-bottom) + 18px); position: relative;
    transform: translateY(100%); transition: transform .26s var(--ease); }
  .sheet.on > div { transform: none; }
  .sheet > div::before { content: ''; position: absolute; top: 8px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 9px; background: var(--line); }
  .sheet.drag > div { transition: none; }
  html.light .sheet > div { background: var(--panel); }
  .sheet h2 { margin: 0 0 12px; font-size: 17px; }
  #impBtn { display: block; width: 100%; margin: 14px 0 84px; padding: 11px; border-radius: 12px; border: 1px dashed var(--line); color: var(--dim); font-size: 14px; }
  #impList { max-height: 58vh; overflow-y: auto; margin-top: 10px; -webkit-overflow-scrolling: touch; }
  #impList .card .warn { color: var(--warm); } #impList .card.dim { opacity: .55; }
  .impRow { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--dim); }
  .tag.mach { color: var(--text, #ddd); border-style: dashed; }
  .card.act .live { color: var(--cyan); } .card.act.idle .live { color: var(--faint); }
  .offl { font-size: 12px; color: var(--faint); margin: 6px 2px 10px; }
  /* 另一台电脑：接入 / 同步开关 */
  .mcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .mcard .mh { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .mcard .mh b { flex: 1; font-size: 15.5px; }
  .mcard .mh span { font-size: 12px; color: var(--faint); }
  .mcard .mh span.on { color: var(--green, #7fd18b); }
  .sw { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 0; background: none; border: 0; border-top: 1px solid var(--line); color: var(--text); text-align: left; font-size: 14px; }
  .sw i { flex: none; width: 40px; height: 23px; border-radius: 99px; background: rgba(255,255,255,.14); position: relative; transition: background .2s; }
  .sw i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .sw.on i { background: var(--warm); }
  .sw.on i::after { transform: translateX(17px); }
  .sw small { display: block; color: var(--faint); font-size: 11.5px; }
  .mcard .syn { font-size: 12px; color: var(--dim); margin-top: 6px; line-height: 1.5; }
  #pkLog { max-height: 56vh; overflow-y: auto; margin-top: 10px; -webkit-overflow-scrolling: touch; }
  #pkLog .msg { font-size: 14.5px; }
  .sheet label { display: block; font-size: 12.5px; color: var(--dim); margin: 12px 0 5px; }
  .sheet select, .sheet input { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 16px; }
  .seg { display: flex; gap: 8px; } .seg button { flex: 1; padding: 11px; border-radius: 12px; border: 1px solid var(--line); color: var(--dim); }
  .seg button.on { border-color: var(--warm); color: var(--warm); background: rgba(245,181,131,.08); }
  .seg.sm { flex-wrap: wrap; gap: 6px; } .seg.sm button { flex: 1 0 auto; padding: 9px 10px; font-size: 14px; }
  .msg .q { display: none; font-size: 11.5px; color: var(--warm); margin-top: 4px; }
  .msg.queued .q { display: block; }
  .msg .unq { margin-left: 6px; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--warm); color: var(--warm); font-size: 11.5px; }
  #now { flex: none; height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid var(--warm); color: var(--warm); font-weight: 700; display: none; }
  #now.on { display: block; }
  .sheet .go.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--line); margin-top: 10px; }
  #mvBody .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  #mvBody .row span:last-child { color: var(--dim); }
  #mvBody .fl { font-size: 12px; color: var(--faint); margin: 6px 0 0; line-height: 1.6; word-break: break-all; }
  #mvBody .go small { display: block; font-weight: 400; font-size: 12px; opacity: .75; margin-top: 2px; }
  .bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin: 14px 0 8px; }
  .bar i { display: block; height: 100%; background: var(--warm); transition: width .4s; }
  .sheet .go { width: 100%; margin-top: 18px; padding: 13px; border-radius: 12px; background: var(--warm); color: var(--on-warm); font-weight: 700; }
  .hint { font-size: 12px; color: var(--faint); margin-top: 6px; line-height: 1.5; }
  #lock { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: none; flex-direction: column; justify-content: center; padding: 24px; text-align: center; }
  #lock.on { display: flex; }
  #lock input { font-size: 28px; letter-spacing: .3em; text-align: center; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); margin: 18px auto; width: 220px; }
  #lock button { padding: 12px 40px; border-radius: 12px; background: var(--warm); color: var(--on-warm); font-weight: 700; margin: 0 auto; }
  /* 按压反馈：手指按下去东西要「应」一下 */
  .card, .sheet .go, .mbtn, #plusSheet .act, .seg button, #send, #attach, #newBtn, .opt, .askSend, #fbar button, #quick button, #tbar button, .qmini {
    transition: transform .12s var(--ease), opacity .12s, background-color .15s; }
  .card:active, .sheet .go:active, .mbtn:active, #plusSheet .act:active, #newBtn:active, .opt:active, .askSend:active, .qmini:active { transform: scale(.98); }
  .seg button:active, #send:active, #attach:active, #fbar button:active, #quick button:active, #tbar button:active { opacity: .7; }
  /* 进出对话：轻轻从右边滑进来，像翻到下一页 */
  @keyframes inR { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  @keyframes inF { from { opacity: 0; } to { opacity: 1; } }
  .view.enter { animation: inR .22s var(--ease); } .view.back { animation: inF .18s; }
  /* 统一的轻提示，替代系统 alert 那种生硬弹框 */
  #ptr { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 10px); z-index: 55; display: flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 999px; font-size: 13px; background: var(--surface, #222); color: var(--text, #eee); border: 1px solid var(--line, #444);
    box-shadow: 0 6px 20px rgba(0,0,0,.18); opacity: 0; transform: translate(-50%, -60px); pointer-events: none; }
  #ptr.back { transition: transform .2s, opacity .2s; }
  #ptr i { font-style: normal; display: inline-block; transition: transform .15s; }
  #ptr.ready i { transform: rotate(180deg); }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); transform: translate(-50%, 8px); z-index: 60; max-width: 86%;
    padding: 10px 16px; border-radius: 14px; background: rgba(36,32,44,.96); color: #F1EDF0; font-size: 14px; line-height: 1.45; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s var(--ease); box-shadow: 0 6px 20px rgba(0,0,0,.28); }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #toast.bad { background: #5a2420; }
  /* 第一次加载时的占位卡，别让人对着一片黑等 */
  .skel { height: 84px; border-radius: 16px; margin-bottom: 8px; background: linear-gradient(90deg, var(--panel) 30%, var(--panel2) 50%, var(--panel) 70%); background-size: 300% 100%; animation: sk 1.2s infinite linear; }
  @keyframes sk { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .tip1 { font-size: 12.5px; color: var(--faint); text-align: center; margin: 4px 0 12px; }
  @media (prefers-reduced-motion: reduce) { .sheet > div, .view.enter, .view.back, .skel { transition: none; animation: none; } }
  #viewer { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; }
  #viewer.on { display: flex; } #viewer img { max-width: 100%; max-height: 100%; }

  /* 环境光放在页面底层，为半透明材质提供柔和的颜色。 */
  :root { --bg:#0A0A0C; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.07); --line:rgba(255,255,255,.08); --text:#F5F5F7; --dim:rgba(235,235,245,.62); --faint:rgba(235,235,245,.38); --warm:#E8B48A; --on-warm:#24150D; --green:#7FD69A; --red:#FF8A80; --cyan:#8FD8E0; --me:rgba(232,180,138,.14); --glass:rgba(28,28,32,.72); --surface:#1c1c20; --spring:cubic-bezier(.32,.72,0,1); --ease:var(--spring); --card-shadow:inset 0 1px 0 rgba(255,255,255,.05); }
  html.light { color-scheme:light; --bg:#F5F5F7; --panel:#fff; --panel2:#f0f0f2; --line:rgba(60,60,67,.11); --text:#1D1D1F; --dim:rgba(60,60,67,.6); --faint:rgba(60,60,67,.36); --warm:#B8763F; --on-warm:#24150D; --green:#328454; --red:#C54E49; --cyan:#287C85; --me:#f4e5d9; --glass:rgba(255,255,255,.78); --surface:#fff; --scrim:rgba(29,29,31,.32); --card-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05); }
  html, body { font-family:-apple-system,"SF Pro Display","PingFang SC","Noto Sans SC",sans-serif; }
  body { background:radial-gradient(ellipse at 0 0,rgba(232,180,138,.10),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(120,140,255,.06),transparent 55%),var(--bg); background-attachment:fixed; }
  html.light body { background:radial-gradient(ellipse at 0 0,rgba(232,180,138,.11),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(120,140,255,.05),transparent 55%),var(--bg); }
  /* 顶栏只在内容经过时出现玻璃；大标题属于滚动内容，避免占用常驻空间。 */
  header { position:relative; z-index:5; min-height:calc(env(safe-area-inset-top) + 54px); padding:calc(env(safe-area-inset-top) + 8px) 16px 8px; border-color:transparent; }
  body.scrolled header, body.inthread header { background:var(--glass); border-color:var(--line); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%); }
  header b, body:not(.inthread) header b { font-size:17px; font-weight:600; text-align:center; transition:opacity 240ms var(--spring); }
  body:not(.inthread):not(.scrolled) header b { opacity:0; }
  body:has(#frames.on) header b { opacity:1 !important; }
  .large-title { margin:4px 2px 16px; font-size:32px; line-height:1.15; font-weight:700; letter-spacing:-.02em; transition:opacity 240ms var(--spring),transform 240ms var(--spring); }
  body.scrolled .large-title { opacity:0; transform:translateY(-8px); }
  #tabs { gap:4px; padding:4px 12px 10px; border:0; scrollbar-width:none; }
  #tabs::-webkit-scrollbar { display:none; }
  #tabs button { position:relative; border:0; padding:8px 13px; font-weight:500; }
  #tabs button.on { color:var(--text); background:var(--panel2); box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
  main { padding:12px 16px 24px; overscroll-behavior-y:contain; }
  .view.on { display:block; }
  #vseg { gap:0; padding:4px; margin:0 0 16px; border:1px solid var(--line); border-radius:16px; background:var(--panel); }
  #vseg button { border:0; border-radius:12px; padding:9px; font-size:14px; }
  #vseg button.on { color:var(--text); background:var(--panel2); box-shadow:0 1px 4px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.05); }
  /* 卡片基础形状；玻璃材质在后面的统一规则中设置。 */
  .qcard,.qmini,.kp,.meter,.mcard,.card { border-radius:20px; border:1px solid var(--line); background:var(--panel); box-shadow:var(--card-shadow); }
  .qcard { padding:14px 12px 12px; } .qcard .qh,.kh { margin-bottom:10px; letter-spacing:.01em; }
  .kp,.qmini { padding:14px 16px; } .meters { gap:10px; }
  #qdots { gap:6px; margin:10px 0 14px; } #qdots i { width:6px; height:6px; transition:none; } #qdots i.on { width:16px; background:var(--warm); }
  h3.sec { margin:20px 2px 10px; color:var(--faint); font-size:13px; font-weight:500; letter-spacing:.02em; }
  .card,.mcard { padding:16px; margin-bottom:10px; } .card .t { font-size:16px; letter-spacing:-.01em; } .card .sum { line-height:1.5; }
  .card.thing { border-color:rgba(232,180,138,.20); } html.light .card.thing { border-color:rgba(184,118,63,.25); }
  .st.running { color:var(--green); } .st.running.dot::before { animation:statusGlow 2.4s ease-in-out infinite; }
  @keyframes statusGlow { 0%,100% { opacity:.65; transform:scale(.85); } 50% { opacity:1; transform:scale(1.18); } }

<script>

  const art = {
    empty: '<path d="M25 30h19l6 7h21v27H25z"/><path d="M25 40h46M32 28h19"/>',
    folder: '<path d="M20 35h23l6 6h27l-5 23H25z"/><path d="M25 35v-8h19l6 6"/>',

    search: '<circle cx="43" cy="42" r="17"/><path d="m55 54 15 15M36 42h14"/>',
    lock: '<rect x="28" y="40" width="40" height="29" rx="9"/><path d="M35 40v-9a13 13 0 0 1 26 0v9M48 52v7"/>'
  };
  return `<svg class="sticker" viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="sticker-glass" x2="1" y2="1"><stop stop-color="#e8b48a" stop-opacity=".38"/><stop offset=".5" stop-color="#aaa0c6" stop-opacity=".3"/><stop offset="1" stop-color="#8fcbd9" stop-opacity=".38"/></linearGradient></defs><circle cx="48" cy="48" r="38" fill="url(#sticker-glass)"/><path d="M22 39a29 29 0 0 1 28-20" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/><g fill="none" stroke="#e8c6ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${art[kind]}</g></svg>`;

  const names = { '📖':'book', '📝':'edit', '▶':'play', '▶️':'play', '🤖':'bot' };
  return match ? ICON(names[match[1]], 15) + ' ' + esc(String(text).slice(match[0].length)) : esc(text);

function toast(t, ok) {
  const e = $('#toast'); if (!e) return;
  e.replaceChildren(); e.insertAdjacentHTML('afterbegin', ICON(ok === true ? 'check' : ok === 'info' ? 'info' : 'alert', 18));
  e.appendChild(document.createTextNode(t)); e.classList.toggle('bad', !ok); e.classList.add('on');
  if (ok !== 'info') haptic(ok ? 'confirm' : 'reject');
  clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), ok ? 2200 : 3600);
}
const post = (p, b) => api(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });

if (window.marked) marked.use({ renderer: { html: t => esc(typeof t === 'string' ? t : t.text) } });
const md = t => window.marked ? marked.parse(t) : esc(t).replace(/\n/g, '<br>');
const isVideo = f => /\.(mp4|mov|m4v|webm)$/i.test(f);
const isImg = f => /\.(png|jpe?g|webp|gif|heic)$/i.test(f);
const media = f => isVideo(f) ? `<video class="media" src="${esc(url(f))}" controls playsinline preload="metadata"></video>`
  : isImg(f) ? `<img class="media" src="${esc(url(f))}" loading="lazy" alt="">` : `<a href="${esc(url(f))}">📎 ${esc(f.split('/').pop())}</a>`;
const ST = { running: '干活中', review: '做完了', error: '出错了', idle: '空闲', done: '已完成' };
// 项目根目录下的只显示项目名（根目录大家都一样，占地方又没信息量）；根目录外的（接过来的旧会话）把家目录缩成 ~
const proj = p => { p = p || ''; const r = ((S && S.roots) || []).find(r => p.startsWith(r + '/'));
  return r ? p.slice(r.length + 1) : p.replace(/^\/(Users|home)\/[^/]+\//, '~/'); };
const ago = s => { const d = (Date.now() - new Date(s.replace(' ', 'T'))) / 1000; return d < 60 ? '刚刚' : d < 3600 ? Math.floor(d / 60) + ' 分钟前' : d < 86400 ? Math.floor(d / 3600) + ' 小时前' : s.slice(5, 10); };
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

let S = null, cur = null, curT = null, last = 0, pending = [], agent = 'claude';

// ---------- 模型 / 强度 ----------
// 空串 = 不指定，走电脑上 Claude 自己的默认设置（~/.claude/settings.json），每个人的默认不一样，所以就叫「默认」
const MODELS = [['', '默认'], ['opus', 'Opus'], ['sonnet', 'Sonnet'], ['haiku', 'Haiku'], ['fable', 'Fable']];
const EFFORTS = [['', '默认'], ['low', '低'], ['medium', '中'], ['high', '高'], ['xhigh', '很高'], ['max', '最高']];
// Codex 只换模型，强度用 config.json 的 codex_effort；可选的模型也来自配置（codex_models），拿到 state 后再填
const xModels = () => [['', (S && S.codex_default) || '默认'], ...((S && S.codex_models) || []).map(m => [m, m])];
// net：这个对话的 Codex 能不能联网（连路由器这类局域网设备要开）；新对话默认关，不记上次的选择，免得顺手全开了
const xnorm = (m, net) => ({ model: m || '', effort: '', net: net ? '1' : '' });
let optAg = 'claude';
const norm = o => ({ model: o.model || '', effort: o.effort || '' });
let opt = norm({ model: store.get('cModel'), effort: store.get('cEffort') });
const segHtml = (k, xs) => `<div class="seg sm" data-k="${k}">` + xs.map(([v, n]) => `<button data-v="${v}" class="${opt[k] === v ? 'on' : ''}">${n}</button>`).join('') + '</div>';
function renderOpts() {
  document.querySelectorAll('.cOpts').forEach(el => el.innerHTML = optAg === 'codex'
    ? '<label>模型</label>' + segHtml('model', xModels())
      + '<label>联网（要连路由器、局域网设备时开；写文件的限制不变）</label>' + segHtml('net', [['', '关'], ['1', '开']])
    : '<label>模型</label>' + segHtml('model', MODELS) + '<label>强度（越高越聪明，也越慢越费额度）</label>' + segHtml('effort', EFFORTS));
}
document.addEventListener('click', e => {
  const b = e.target.closest('.seg.sm button'); if (!b) return;
  opt[b.parentNode.dataset.k] = b.dataset.v; renderOpts();
});
// 顶上那行只说模型名；强度不是默认才提一句
const optLabel = t => { if (t.agent !== 'claude') return (xnorm(t.model).model || (S && S.codex_default) || '默认') + (t.net ? ' · 联网' : ''); const o = norm(t);
  return (MODELS.find(x => x[0] === o.model) || [, o.model])[1] + (o.effort ? ' · ' + ((EFFORTS.find(x => x[0] === o.effort) || [, o.effort])[1]) : ''); };

// ---------- 列表页 ----------
// 额度电表：圈里写「还剩多少」，颜色跟着剩余变：够用绿、过半用掉橙、快没了红
function renderQuota(q) {
  const now = Date.now() / 1000;
  const when = t => { const d = new Date(t * 1000), td = new Date();
    const hm = d.toTimeString().slice(0, 5);
    if (d.toDateString() === td.toDateString()) return hm;
    if (d.toDateString() === new Date(+td + 864e5).toDateString()) return '明天 ' + hm;
    return '周' + '日一二三四五六'[d.getDay()] + ' ' + hm; };
  const g = (w, name) => {
    if (!w) return '';
    const gone = w.reset && w.reset < now, left = gone ? 100 : Math.max(0, 100 - w.pct);
    const c = left >= 50 ? 'var(--green)' : left >= 20 ? 'var(--warm)' : 'var(--red)', C = 2 * Math.PI * 27;
    return `<div class="gauge"><div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="6"/>
      <circle cx="32" cy="32" r="27" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C * left / 100} ${C}"/></svg>
      <b style="color:${c}">${left}%<i>剩余</i></b></div><span>${name}</span><em>${gone ? '已重置' : w.reset ? when(w.reset) + ' 重置' : ''}</em></div>`;
  };
  // 平时只占一条：两家各一行细电表，一眼看剩多少；点一下展开成圆表，看重置时间、手动刷新
  if (!store.get('qOpen')) {
    const bar = (w, name) => { if (!w) return '';
      const left = w.reset && w.reset < now ? 100 : Math.max(0, 100 - w.pct), c = left >= 50 ? 'var(--green)' : left >= 20 ? 'var(--warm)' : 'var(--red)';
      return `<span class="qb"><em>${name}</em><i><b style="width:${left}%;background:${c}"></b></i><u style="color:${c}">${left}%</u></span>`; };
    const row = (name, x) => `<div class="qr"><strong>${name}</strong>${x ? bar(x.five_hour, '5小时') + bar(x.seven_day, '本周') : '<span class="qb"><em>还没有数据</em></span>'}</div>`;
    $('#meters').className = 'meters one';
    $('#meters').innerHTML = `<button class="qmini" data-q="open">${row('Claude', q.claude)}${row('Codex', q.codex)}</button>`;
    return;
  }
  $('#meters').className = 'meters';
  const card = (k, name, x, refresh) => `<div class="qcard"><div class="qh">${name}<small>${x ? ago(new Date(x.ts * 1000).toLocaleString('sv')) + '的数' : ''}</small>${refresh ? `<button class="qRef" data-who="${k}" title="刷新">↻</button>` : ''}</div>`
    + (x ? `<div class="qrow">${g(x.five_hour, '5 小时')}${g(x.seven_day, '本周')}</div>` : `<div class="none">${refresh ? '还没数据，点 ↻ 查一下' : '用过一次 Codex 就有'}</div>`) + '</div>';
  $('#meters').innerHTML = card('claude', 'Claude', q.claude, true) + card('codex', 'Codex', q.codex, true) + '<button class="qfold" data-q="close">收起 ︿</button>';
}
// 两家的数都只在跑活时顺带回来；想看最新的手动刷一下（Claude 用 Haiku、Codex 用 Luna 回一个字，几乎不占额度）
$('#meters').onclick = async e => {
  const t = e.target.closest('[data-q]');
  if (t) { store.set('qOpen', t.dataset.q === 'open' ? '1' : ''); haptic('tap'); renderQuota(S.quota); return; }
  const b = e.target.closest('.qRef'); if (!b || b.classList.contains('spin')) return;
  b.classList.add('spin');
  try { const d = await post('/api/console/quota_refresh', { who: b.dataset.who }); S.quota = d.quota; renderQuota(d.quota); haptic('confirm'); }
  catch (er) { b.classList.remove('spin'); toast(er.message); }
};
function renderActive() {
  // 终端 / 桌面版里自己开的会话：只看进度，点开能看最后几句、接过来
  const xs = S.active || [];
  return (xs.length ? `<h3 class="sec">电脑上自己开的 · ${xs.filter(x => x.running).length} 个在跑</h3>` + xs.map(x => `<button class="card act ${x.running ? '' : 'idle'}" data-a="${x.agent}" data-s="${esc(x.session)}">
      <div class="top"><span class="t">${esc(x.title)}</span><span class="tag ${x.agent}">${x.agent === 'claude' ? 'Claude' : 'Codex'}</span>
      <span class="st dot ${x.running ? 'running' : 'idle'}">${x.running ? '在跑' : '停了'}</span></div>
      <div class="meta">${esc(proj(x.cwd))} · ${ago(x.updated)}</div>${x.live ? `<div class="live">${liveIcon(x.live)}</div>` : ''}</button>`).join('') : '');
}
let folder = store.get('folder') || '';
const rank = t => t.pin ? 0 : t.status === 'running' ? 1 : t.status === 'error' || t.ask ? 2 : t.status === 'review' ? 3 : t.status === 'idle' ? 4 : 5;
const stOf = t => t.ask && t.status === 'review' ? `<span class="st dot error">待办</span>` : `<span class="st dot ${t.status}">${ST[t.status]}${t.elapsed ? ' ' + mmss(t.elapsed) : ''}</span>`;
// 三层：标题和状态 / 停在哪（在跑就是正在干的那步，否则最后一句话）/ 谁、哪个项目、多久前。
// 完整路径大家都一样，占地方又没信息量，只留项目名
const oneCard = t => `<button class="card" data-id="${t.id}">
      <div class="top"><span class="t">${esc(t.title)}</span>${stOf(t)}</div>
      ${t.live ? `<div class="live">${liveIcon(t.live)}</div>` : t.note ? `<div class="live" style="color:var(--red)">${esc(t.note)}</div>` : t.last ? `<div class="sum">${esc(t.last)}</div>` : ''}
      <div class="meta"><span class="ag ${t.agent}">${t.agent === 'claude' ? 'Claude' : 'Codex'}</span> · ${t.folder && !folder ? ICON('folder', 14) + ' ' + esc(t.folder) + ' · ' : ''}${esc(t.cwd.split('/').pop())} · ${ago(t.updated)}</div></button>`;
// 要用户动手的：AI 在问 / 让选，或者出错停了
const needMe = t => t.status === 'error' || (t.ask && t.status === 'review');
// 用对话 id 保存上次状态，轮询重画时只在真正完成一轮后闪一次。
let previousStatuses = new Map();
function renderList() {
  const changed = new Set(S.threads.filter(t => previousStatuses.get(t.id) === 'running' && (t.status === 'review' || t.status === 'idle')).map(t => t.id));
  previousStatuses = new Map(S.threads.map(t => [t.id, t.status]));
  const fs = S.folders || [];
  if (folder && !fs.includes(folder)) folder = '';
  $('#fbar').innerHTML = fs.length ? [['', '全部'], ...fs.map(f => [f, f])].map(([v, n]) => `<button data-f="${esc(v)}" class="${v === folder ? 'on' : ''}">${v ? ICON('folder', 15) + ' ' : ''}${esc(n)}</button>`).join('') : '';
  const ts = S.threads.filter(t => !folder || t.folder === folder);
  if (folder && !ts.length) { $('#list').innerHTML = `<div class="empty">${sticker('folder')}这个文件夹空了</div>`; return; }
  if (!ts.length && !(S.active || []).length) { $('#list').innerHTML = `<div class="empty">${sticker('empty')}还没有对话。<br>点右下角「＋ 新对话」，选一个项目，派活给 Claude 或 Codex。</div>`; return; }
  const items = ts.map(t => ({ t, r: rank(t), pin: t.pin || 0 }));
  const groups = [[ICON('pin', 16) + ' 置顶', 0], ['干活中', 1], ['待办', 2], ['做完了', 3], ['其他', 4], ['已完成', 5]];
  // 电脑上自己开的：有在跑的才放最上面；都停着就排到「待办」后面，别挡住正事
  const act = renderActive(), up = (S.active || []).some(x => x.running);
  $('#list').innerHTML = (items.length && !ts.some(needMe) ? `<div class="clear-note">${sticker('done')}<span>待办都处理完了</span></div>` : '') + (up && !folder ? act : '') + groups.map(([g, r]) => {
    const xs = items.filter(x => x.r === r); if (!xs.length) return '';
    if (!r) xs.sort((a, b) => b.pin - a.pin);
    // 「做完了」堆多了一下清掉：只收起 AI 没在问的，在问的本来就在「待办」里
    const tidy = r === 3 && xs.length > 1 ? '<button class="tidy" id="tidyBtn">全部收起</button>' : '';
    return `<h3 class="sec">${g} · ${xs.length}${tidy}</h3>` + xs.map(x => oneCard(x.t)).join('');
  }).map((h, i) => i === 3 && !up && !folder ? act + h : h).join('')
    // 长按菜单藏得深，第一次用的人不会知道；长按过一次就不再提
    + (ts.length && !store.get('lpSeen') ? '<div class="tip1">长按一条可以改名、置顶、放文件夹、删除</div>' : '');
  items.filter(x => changed.has(x.t.id)).forEach(x => {
    const card = [...$('#list').querySelectorAll('.card')].find(el => el.dataset.id === String(x.t.id));
    if (card) card.classList.add('status-glow');
  });
}
$('#fbar').onclick = e => { const b = e.target.closest('button'); if (!b) return; folder = b.dataset.f; store.set('folder', folder); renderList(); };

// ---------- 整理一条对话：长按卡片，或在对话里点标题 ----------
let mg = null, lpT = 0, lpDone = false, lpXY = null;
$('#list').addEventListener('pointerdown', e => {
  const c = e.target.closest('.card[data-id]'); if (!c) return;
  lpDone = false; lpXY = [e.clientX, e.clientY];
  lpT = setTimeout(() => { lpDone = true; c.classList.add('lp'); haptic('long'); store.set('lpSeen', '1');
    setTimeout(() => c.classList.remove('lp'), 200); openManage(c.dataset.id); }, 480);
});
// 手指一动就是在滑列表，不算长按
$('#list').addEventListener('pointermove', e => { if (lpT && lpXY && Math.hypot(e.clientX - lpXY[0], e.clientY - lpXY[1]) > 10) { clearTimeout(lpT); lpT = 0; } });
['pointerup', 'pointercancel', 'pointerleave'].forEach(k => $('#list').addEventListener(k, () => { clearTimeout(lpT); lpT = 0; }));
$('#list').addEventListener('contextmenu', e => { if (e.target.closest('.card[data-id]')) e.preventDefault(); });
function openManage(id) {
  const t = (S.threads || []).find(x => x.id === id) || (curT && curT.id === id ? curT : null); if (!t) return;
  mg = t;
  $('#mgName').value = t.title;
  const fs = [...new Set([...(S.folders || []), t.folder].filter(Boolean))];
  $('#mgFolders').innerHTML = [['', '不放'], ...fs.map(f => [f, f])].map(([v, n]) => `<button data-f="${esc(v)}" class="${(t.folder || '') === v ? 'on' : ''}">${v ? ICON('folder', 16) + ' ' : ''}${esc(n)}</button>`).join('') + '<button data-new="1">＋ 新文件夹</button>';
  $('#mgNewRow').style.display = 'none';
  $('#mgDone').innerHTML = t.status === 'done' ? ICON('undo') + ' 不小心点了「完成」？放回「待你看」' : ICON('check') + ' 这事完了，收进「已完成」';
  $('#mgDone').disabled = t.status === 'running';
  $('#mgPin').innerHTML = ICON('pin') + (t.pin ? ' 取消置顶' : ' 置顶');
  $('#mgDel').disabled = t.status === 'running';
  $('#mgDel').innerHTML = ICON('trash') + (t.status === 'running' ? ' 它在干活，停下后才能删' : ' 从列表里删掉');
  $('#mgSheet').classList.add('on');
}

$('#mgNew').onkeydown = e => { if (e.key === 'Enter') $('#mgNewGo').click(); };

$('#thSheet').onclick = e => { if (e.target.id === 'thSheet') $('#thSheet').classList.remove('on'); };

let pk = null;
async function peek(x) {
  pk = x; $('#pkT').textContent = '读取中…'; $('#pkM').textContent = ''; $('#pkLog').innerHTML = ''; $('#pkH').textContent = '';
  $('#pkSheet').classList.add('on');

    const d = await post('/api/console/peek', x);
    if (pk !== x) return;
    $('#pkT').textContent = d.title;
    $('#pkM').textContent = `${proj(d.cwd)} · ${d.running ? '正在跑' : '最后动过 ' + ago(d.updated)}`;
    $('#pkLog').innerHTML = d.msgs.map(m => `<div class="msg ${m.role}" data-raw="${esc(m.text)}">${m.role === 'ai' ? md(m.text) : esc(m.text)}</div>`).join('')
      + (d.running && d.live ? `<div class="live" style="color:var(--cyan);font-size:13px">${esc(d.live)}</div>` : '');
    $('#pkLog').querySelectorAll('.msg').forEach(addCopy);
    $('#pkLog').scrollTop = 1e9;
    $('#pkH').textContent = d.running ? '它还在电脑上跑着。现在接过来发话，两边会各干各的、互相看不到；最好等它停了再接。' : '接过来后在手机上发话，就是接着这个对话干，前面的它都记得。电脑上那个窗口别再同时用。';
  } catch (e) { $('#pkT').textContent = e.message; }
}
$('#pkSheet').onclick = e => { if (e.target.id === 'pkSheet') { pk = null; $('#pkSheet').classList.remove('on'); } };

// 连不上时原来把错误吞了，分不清是 AI 没动静还是手机没连上。成功一次记个时间，失败就亮小条写明上次更新几点
let lastOk = 0;
function net(e) {
  const bar = $('#netbar');
  if (!e) { lastOk = Date.now(); bar.hidden = true; return; }
  if (e.message === '口令不对') return;   // 口令错有锁屏页管
  const t = lastOk ? new Date(lastOk).toTimeString().slice(0, 5) : '—';
  bar.querySelector('span').textContent = `连接中断 · 上次更新 ${t}`; bar.hidden = false;
}
$('#netbar button').onclick = () => { haptic('tap'); refresh(); };

// ---------- 每条对话自己的草稿 ----------
// 输入框、附件、引用全页共用一份：给 A 写到一半去回 B，A 的字和图会跟过去，容易发错地方。
// 所以按对话 id 各存一份，切走时存、打开时取；同时落到 localStorage，App 被系统杀掉也不丢长段派活说明。
// 内存里保留附件对象本身：切走时还没传完的，传完会把 path 写回这个对象，存盘时就能带上
const DR = (() => { try { return JSON.parse(localStorage.getItem('drafts') || '{}'); } catch (e) { return {}; } })();
function persistDrafts() {
  const out = {};
  for (const [id, d] of Object.entries(DR)) {
    const files = (d.pending || []).filter(p => p.path).map(p => ({ path: p.path, name: p.name, img: p.img }));
    if (d.text || files.length || (d.refs || []).length || d.quote) out[id] = { text: d.text, pending: files, refs: d.refs, quote: d.quote };
  }
  try { localStorage.setItem('drafts', JSON.stringify(out)); } catch (e) {}
}
function saveDraft() {

  if (text.trim() || pending.length || refs.length || quote) DR[cur] = { text, pending: pending.slice(), refs: refs.slice(), quote };

}
function loadDraft(id) {

  pending = (d.pending || []).map(p => p.url || !p.path ? p : { ...p, url: url(p.path) }); renderPending();
  refs = (d.refs || []).slice(); renderRefs(); setQuote(d.quote || '');

const closeSheet = el => el.id === 'plusSheet' ? closePlus() : el.classList.remove('on');
// 面板往下拽就关，手机上比去找空白处点顺手。只在面板滚到顶时接管，不然会和面板里的滚动打架。
// 用 touch 事件而不是 pointer：手指一动浏览器就开始滚动并发 pointercancel，pointer 拿不到后续位置
(() => {
  let el = null, y0 = 0, dy = 0;
  document.addEventListener('touchstart', e => {
    const p = e.target.closest('.sheet.on > div');
    el = p && p.scrollTop <= 0 && !e.target.closest('input,textarea,select') ? p : null;
    if (el) { y0 = e.touches[0].clientY; dy = 0; }
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!el) return; dy = e.touches[0].clientY - y0;
    if (dy < 0 && !el.parentNode.classList.contains('drag')) { el = null; return; }   // 往上推是想滚内容
    if (dy > 6) { e.preventDefault(); el.parentNode.classList.add('drag'); el.style.transform = `translateY(${Math.max(0, dy)}px)`; }
  }, { passive: false });
  const end = () => {
    if (!el) return; const p = el; el = null;
    p.parentNode.classList.remove('drag');
    if (dy > 90) {   // 从手指松开的位置接着滑下去，而不是先弹回顶再收
      p.style.transform = 'translateY(100%)'; closeSheet(p.parentNode);
      setTimeout(() => p.style.transform = '', 300);
    } else p.style.transform = '';

  document.addEventListener('touchend', end); document.addEventListener('touchcancel', end);
})();
// 下拉刷新：页面本来每 2.5 秒自己拉数据，所以这里直接整页重载——卡住、改了代码、App 里没地址栏时都能靠它救回来。
// 只在列表/对话滚到顶、没开面板时接管，跟面板下拽关闭、卡片左右滑互不抢。
(() => {
  const ind = $('#ptr'), txt = ind.querySelector('span'), main = $('#main'), TH = 70;
  let on = false, x0 = 0, y0 = 0, d = 0, pulling = false, tgt = null;
  const paint = () => { ind.style.opacity = Math.min(1, d / TH); ind.style.transform = `translate(-50%, ${Math.min(d, TH + 20) - 60}px)`;
    const r = d >= TH; ind.classList.toggle('ready', r); txt.textContent = r ? '松手刷新' : '下拉刷新'; };
  document.addEventListener('touchstart', e => {
    on = main.scrollTop <= 0 && !document.querySelector('.sheet.on') && !e.target.closest('input,textarea,select,.sheet');
    if (!on) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; d = 0; pulling = false; ind.classList.remove('back');
    // 后续 touchmove/touchend 只发给按下时的那个节点；列表每 2.5 秒整个重绘，节点被换掉后事件冒不到 document，
    // 所以直接挂在节点本身上——脱离页面的节点照样收得到
    tgt = e.target; tgt.addEventListener('touchmove', move, { passive: false });
    tgt.addEventListener('touchend', end); tgt.addEventListener('touchcancel', end);
  }, { passive: true });
  const move = e => {

    const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if (!pulling) {

    if (tgt) { tgt.removeEventListener('touchmove', move); tgt.removeEventListener('touchend', end); tgt.removeEventListener('touchcancel', end); tgt = null; }
    if (!on) return; on = false; if (!pulling) return;
    ind.classList.add('back');
    if (d >= TH) { txt.textContent = '刷新中…'; ind.querySelector('i').textContent = '⟳'; if (cur) saveDraft(); setTimeout(() => location.reload(), 120); }
    else { d = 0; paint(); }
  };
})();

  } else if (m.role === 'user' && CMDS[m.text]) {

  } else if (m.role === 'user') {

    const [qt, body0] = splitQuote(m.text), [body, rb] = body0.split('\n\n〔引用对话〕');
    const rs = rb ? [...rb.matchAll(/^- 《(.+?)》/gm)].map(x => x[1]) : [];
    el.innerHTML = (qt ? `<div class="qd">${esc(qt)}</div>` : '') + esc(body) + (rs.length ? `<div class="refd">${rs.map(r => `<span class="rchip"><span>🔗 ${esc(r)}</span></span>`).join('')}</div>` : '') + (m.files.length ? `<div class="att">${m.files.map(f => isImg(f) ? `<img src="${esc(url(f))}" alt="">` : media(f)).join('')}</div>` : '') + `<span class="ts">${esc(m.ts.slice(5, 16))}</span><span class="q">⏳ 排队中：它做完这一轮就接着看 <button class="unq" data-mid="${m.id}">撤回改一下</button></span>`;
  } else {

    el.innerHTML = md(text).replace(/<p>§ASK(\d+)§<\/p>|§ASK(\d+)§/g, (_, a, b) => `<div data-ask="${a ?? b}"></div>`) + m.files.map(media).join('') + `<span class="ts">${esc(m.ts.slice(5, 16))}</span>`;

  $('#input').placeholder = on ? '顺便问一句…' : curT && curT.status === 'running' ? '补一句…' : '派活…';
  $('#send').innerHTML = ICON('send', 16) + (on ? ' 问' : curT && curT.status === 'running' ? ' 排队' : ' 发送');
  $('#now').classList.toggle('on', !on && !!curT && curT.status === 'running');
  if (on) $('#input').focus();
}
$('#modeX').onclick = () => setSide(false);
async function askSide(text) {
  if (!text) return;
  $('#send').disabled = true;
  try {
    await post('/api/console/side', { id: cur, text });
    // 答案要等十几秒到一分钟，先放一张「在想」的卡，答案到了替换掉
    const w = document.createElement('div'); w.className = 'msg side wait'; w.dataset.q = text;
    w.innerHTML = `<div class="sq">💬 顺便问：${esc(text)}</div><div class="sa">在想…（它照常干它的，你可以接着做别的）</div>`;
    $('#log').appendChild(w); $('#main').scrollTop = $('#main').scrollHeight;
    $('#input').value = ''; grow(); setSide(false);
  } catch (e) { toast('没问成：' + e.message); }
  $('#send').disabled = false;
}
$('#file').onchange = async e => {
  for (const f of [...e.target.files]) {
    const item = { name: f.name, url: URL.createObjectURL(f), img: f.type.startsWith('image') };
    pending.push(item); renderPending();
    try {
      const blob = item.img && f.size > 2.5e6 ? await shrink(f) : f;
      item.path = (await api('/api/console/upload', { method: 'POST', headers: { 'X-Name': encodeURIComponent(f.name).slice(-40) }, body: blob })).path;
    } catch (err) { pending = pending.filter(x => x !== item); toast('上传失败：' + err.message); }
    renderPending(); saveDraft(); persistDrafts();
  }
  e.target.value = '';
};
// 手机原图动辄 5–10MB，压到长边 2000 再传，AI 看图够用
function shrink(f) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b || f), 'image/jpeg', 0.88);
    };
    img.onerror = () => res(f);
    img.src = URL.createObjectURL(f);
  });
}
function renderPending() {
  $('#pending').innerHTML = pending.map((p, i) => {
    const box = p.img ? `<img class="${p.path ? '' : 'up'}" src="${esc(p.path ? url(p.path) : p.url)}" alt="">` : `<div class="file ${p.path ? '' : 'up'}">${esc(p.name)}</div>`;
    return `<span>${box}<b data-i="${i}">×</b></span>`;
  }).join('');
}
$('#pending').onclick = e => { const i = e.target.dataset.i; if (i != null) { pending.splice(+i, 1); renderPending(); saveDraft(); } };

$('#log').onclick = async e => {
  const u = e.target.closest('.unq');
  if (u) {
    try {
      const d = await post('/api/console/unqueue', { id: cur, mid: +u.dataset.mid });
      u.closest('.msg').remove();
      // 撤回的话放回输入框；输入框里已经有字的话接在后面，不覆盖
      const cur0 = $('#input').value.trim();
      const [qt, body] = splitQuote(d.text); if (qt) setQuote(qt);
      $('#input').value = body + (cur0 ? '\n' + cur0 : '');
      pending = d.files.map(f => ({ path: f, name: f.split('/').pop(), url: url(f), img: isImg(f) })).concat(pending);
      renderPending(); grow(); $('#input').focus();
    } catch (err) { toast(err.message); pollThread(); }
    return;
  }
  if (e.target.matches('img')) { $('#viewer img').src = e.target.src; $('#viewer').classList.add('on'); } };
$('#viewer').onclick = () => $('#viewer').classList.remove('on');

// 直接带着 #对话 打开时，先在历史里垫一层列表，返回才能回到列表而不是退出页面。口令失效时等解锁后再开
// App 后台盯进度用的是原生那边存的口令；只在网页里输了新口令的话原生不知道，后台一拉就 403，通知永远不来（11-04）
// 只在口令被服务器认可后才同步，免得把输错的口令写进去
function openHash() {
  if (location.hash.length > 1 && S && !cur) { const id = location.hash.slice(1); history.replaceState(null, '', location.pathname + location.search); openThread(id); }
}
$('#keyGo').onclick = async () => {
  key = $('#key').value.trim(); store.set('chatKey', key); keyCookie();
  try { await api('/api/console/state'); $('#lock').classList.remove('on'); await loadState(); openHash(); }
  catch (e) { $('#keyErr').textContent = e.message; }
};

(async () => {
  await loadState();
  if (location.hash.length > 1) openHash();
})();
// 2.5 秒刷一次，干活时能跟上进度；切到后台不刷，省电
setInterval(() => { if (document.hidden) return; cur ? pollThread() : loadState(); }, 2500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) cur ? pollThread() : loadState(); });

// 只同步视觉状态：滚动标题、弹层背景和首次出现的列表卡片，不参与业务数据。
(() => {
  const main = document.getElementById('main');
  const list = document.getElementById('list');
  const syncScroll = () => document.body.classList.toggle('scrolled', main.scrollTop > 40);
  main.addEventListener('scroll', syncScroll, { passive: true });
  syncScroll();
  const sheets = [...document.querySelectorAll('.sheet')];
  const syncSheets = () => document.body.classList.toggle('sheet-open', sheets.some(sheet => sheet.classList.contains('on')));
  const sheetObserver = new MutationObserver(syncSheets);
  sheets.forEach(sheet => sheetObserver.observe(sheet, { attributes: true, attributeFilter: ['class'] }));
  syncSheets();
  // 等真实卡片出现再执行一次；后续轮询重建列表不会重新播放。
  const listObserver = new MutationObserver(() => {
    const cards = [...list.querySelectorAll('.card')];
    if (!cards.length) return;
    listObserver.disconnect();
    cards.slice(0, 12).forEach((card, i) => {
      card.style.setProperty('--stagger', `${i * 30}ms`);
      card.classList.add('visual-enter');
    });
  });
  listObserver.observe(list, { childList: true });
})();
</script>
